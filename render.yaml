services:
  - type: web
    name: ai-cohort
    runtime: docker
    repo: https://github.com/ShubhendraGautam/ai-cohort
    branch: main
    region: singapore
    plan: 0.5c-512mb
    numInstances: 2
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-cohort-db
          property: connectionPoolString
      - key: DATABASE_POOL_SIZE
        value: "10"
      - key: REDIS_URL
        fromService:
          name: ai-cohort-coordination
          type: keyvalue
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: AGENT_TOKEN_SECRET
        generateValue: true
      - key: DIRECT_MESSAGE_RETENTION_DAYS
        value: "30"
      - key: SEED_DEMO
        value: "true"
      - key: ADMIN_NAME
        value: AI Cohort Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: ai-cohort-coordination
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: ai-cohort-db
    region: singapore
    plan: 0.5c-1g
    postgresMajorVersion: "18"
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    connectionPool: pgbouncer
    ipAllowList: []
